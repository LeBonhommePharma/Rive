name: Deploy /transit

# Gates every push to main, then asks the apex Pages repo to publish.
#
# The actual publish engine lives in LeBonhommePharma/lebonhommepharma.github.io
# (.github/workflows/publish-transit.yml) because this repo's GITHUB_TOKEN
# cannot write to that repo. See DEPLOY.md.

on:
  push:
    branches: [main]
    # Only the published surface. Touching src/, ios/ or native/ does not
    # change what /transit serves, so it does not need a publish.
    paths:
      - "public/Transit/**"
      - "public/data/**"
      - "public/l10n/**"
      - "public/favicon.svg"
      - "scripts/publish-transit.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-transit
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # See the long scope note in the apex publish-transit.yml: this gates on
      # `npm test` (it imports the shipped static modules) rather than
      # `npm run build`. The suite size is reported, never hard-coded. What is
      # enforced: a summary exists, at least one test ran, every test passed.
      # `node --test` on a glob that matches nothing exits 0 with "tests 0",
      # so exit status alone cannot catch an empty suite.
      - name: "Gate A — tests (count reported; zero or any failure is red)"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rive-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          if npm test 2>&1 | tee "$log"; then rc=0; else rc=$?; fi
          count() { grep -E "^(# |ℹ )$1 [0-9]+$" "$log" | tail -1 | grep -oE '[0-9]+$' || true; }
          total=$(count tests); pass=$(count pass); fail=$(count fail)
          if [ -z "$total" ] || [ -z "$pass" ] || [ -z "$fail" ]; then
            echo "::error::Gate A: no test summary in the output — the runner did not finish or its format changed"; exit 1
          fi
          echo "Gate A: $pass/$total passed, $fail failed"
          echo "Gate A: $pass/$total tests passed" >> "$GITHUB_STEP_SUMMARY"
          [ "$total" -gt 0 ] || { echo "::error::Gate A: 0 tests ran — an empty suite is not a pass"; exit 1; }
          [ "$fail" -eq 0 ] && [ "$pass" -eq "$total" ] || { echo "::error::Gate A: $fail of $total tests failed"; exit 1; }
          [ "$rc" -eq 0 ] || { echo "::error::Gate A: npm test exited $rc although every counted test passed"; exit 1; }

      - name: "Gate B — compose and verify artifact"
        id: build
        run: |
          set -euo pipefail
          # Match the apex engine: stamp the last commit that touched the
          # published surface, so the gate builds the same artifact it will.
          sha=$(git log -1 --format=%H -- \
                  public/Transit public/data public/l10n public/favicon.svg)
          [ -n "$sha" ] || sha=$(git rev-parse HEAD)
          node scripts/publish-transit.mjs compose --src . --out _stage --sha "$sha"
          node scripts/publish-transit.mjs verify-artifact --dir _stage --sha "$sha" | tee _gate.txt
          sha256=$(grep '^index-sha256=' _gate.txt | cut -d= -f2)
          [ -n "$sha256" ] || { echo "::error::Gate B: verify-artifact printed no index-sha256"; exit 1; }
          files=$(find _stage -type f | wc -l | tr -d ' ')
          echo "Gate B: staged $files file(s), index.html sha256 $sha256"
          [ "$files" -gt 0 ] || { echo "::error::Gate B: compose staged 0 files"; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apex publish
        env:
          TOKEN: ${{ secrets.APEX_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # An absent secret is a KNOWN configuration gap with a working
          # fallback, not a broken deploy. Failing the job for it made this
          # workflow permanently red — red since 2026-08-20 across every push
          # — which trains everyone to ignore it and hides the failures that
          # do matter. Warn loudly, stay green, and let the cron publish.
          #
          # A token that IS set but fails still hard-fails below: that is a
          # real breakage and must not be swallowed.
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning title=Immediate publish skipped::APEX_DISPATCH_TOKEN is not set."
            {
              echo "### Immediate publish skipped"
              echo
              echo "\`APEX_DISPATCH_TOKEN\` is not configured, so this push could not"
              echo "dispatch an instant publish."
              echo
              echo "**This commit will still go live.** The apex repo publishes on a"
              echo "schedule (nominally every 15 min; observed 27-33 min under load)."
              echo
              echo "To publish now: lebonhommepharma.github.io -> Actions ->"
              echo "\"Publish /transit\" -> Run workflow."
              echo
              echo "To remove this warning permanently, see DEPLOY.md ->"
              echo "\"The one optional secret\"."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/LeBonhommePharma/lebonhommepharma.github.io/dispatches \
            -d "{\"event_type\":\"transit-publish\",\"client_payload\":{\"ref\":\"${GITHUB_SHA}\"}}"
          echo "Dispatched publish for ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
